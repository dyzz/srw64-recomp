# Security headers for srw64.dreamquest.club, included by nginx-srw64.conf in the server
# and in every location that adds headers of its own (which would drop the server's).
# Installed as /etc/nginx/srw64-headers.conf. The pages carry their own script and style
# policy (a <meta> CSP with hashes, astro.config.mjs security.csp); this one adds what a
# <meta> cannot: no framing by other sites. HSTS is set on the CDN, where HTTPS ends.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
