# srw64.dreamquest.club (MARCHWIND 64): static site from /srv/srw64/current/public and
# the site API on 127.0.0.1:3064 under /api/. TLS ends at the Alibaba Cloud CDN, which
# fetches from here over port 80. Installed as /etc/nginx/sites-available/srw64.

# Rate limits by the visitor's address, which real_ip (in the server below) takes from the
# CDN's Ali-Cdn-Real-Ip header only on requests from the CDN's own addresses.
limit_req_zone $binary_remote_addr zone=srw64_search:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=srw64_api:10m rate=20r/s;
# AI agents ask for Markdown first (Claude Code sends "Accept: text/markdown, text/html, */*");
# browsers never list it.
map $http_accept $srw64_markdown {
    default 0;
    "~*text/markdown" 1;
}
# Where a technical page sends such an agent: the mini stage page to its llms.txt, the others to
# their Markdown source.
map $uri $srw64_agent_doc {
    default "";
    ~^/(zh|en|ja)/docs/mini-stage/$ /docs/mini-stage/llms.txt;
    ~^/(?<agent_lang>zh|en|ja)/docs/(?<agent_slug>[a-z0-9-]+)/$ /$agent_lang/docs/$agent_slug.md;
}

server {
    listen 80;
    server_name srw64.dreamquest.club;

    root /srv/srw64/current/public;
    index index.html;
    client_max_body_size 128k;
    # Only the CDN reaches this site: it adds a secret back-to-origin header, and
    # /etc/nginx/srw64-cdn.conf on the server (written by web/deploy/origin-secret.sh, never in
    # the repository) answers 403 to anything without it, but requests from this machine
    # itself. Having that, it trusts the visitor's address the CDN passes in Ali-Cdn-Real-Ip.
    # Without the file, $remote_addr stays the peer and a forged header changes nothing.
    real_ip_header Ali-Cdn-Real-Ip;
    include /etc/nginx/srw64-cdn*.conf;
    # Security headers (deploy/nginx-srw64-headers.conf). A location that adds its own
    # headers loses these, so each of those includes them again.
    include /etc/nginx/srw64-headers.conf;
    # Pages, llms.txt and the docs' Markdown carry Chinese and Japanese: say UTF-8.
    charset utf-8;
    charset_types text/plain text/css text/markdown application/javascript application/json;
    # Redirects keep the visitor's scheme and host (the CDN ends TLS and fetches over http).
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The maintainers' API is reached over ssh only (web/api/admin.mjs tunnels to 127.0.0.1:3064).
    location /api/admin/ { return 404; }

    # Only the tracker and collector are public. The dashboard is SSH-only on 3065.
    location = /analytics/script.js {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3065/script.js;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/srw64-headers.conf;
    }
    location = /analytics/api/send {
        limit_except POST { deny all; }
        limit_req zone=srw64_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3065/api/send;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Ali-Cdn-Real-Ip "";
        proxy_set_header X-Srw64-Origin "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/srw64-headers.conf;
    }
    location /analytics/ { return 404; }

    # The statistics share link, https://srw64.dreamquest.club/share/<code> (made in Umami:
    # website > share; read-only, the views chosen there). Only what its page reads, GET
    # only: the page and its static files, the share lookup, the configuration and the
    # website endpoints its views read (with the share's token), by name: not the visitor
    # sessions, exports or reports. Logins and every write stay closed (no /api/auth, no
    # POST). Umami's paths do not meet the site's own.
    location ^~ /share/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3065;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/srw64-headers.conf;
    }
    location ^~ /_next/static/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3065;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/srw64-headers.conf;
    }
    location ~ ^/images/(country|browser|os|device)/[a-z0-9_.-]+\.png$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3065;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/srw64-headers.conf;
    }
    location = /datamaps.world.json {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3065;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/srw64-headers.conf;
    }
    location ~ "^/api/(config|share/[A-Za-z0-9]+|websites/[0-9a-f-]{36}(/(active|daterange|stats|annotations|pageviews|metrics|values|breakdown|sessions/weekly|events/stats|events/series))?|realtime/[0-9a-f-]{36})$" {
        limit_except GET { deny all; }
        limit_req zone=srw64_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3065;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/srw64-headers.conf;
    }

    location /api/story/search {
        limit_req zone=srw64_search burst=15 nodelay;
        proxy_pass http://127.0.0.1:3064;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Ali-Cdn-Real-Ip "";
        proxy_set_header X-Srw64-Origin "";
    }

    location /api/ {
        limit_req zone=srw64_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3064;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Ali-Cdn-Real-Ip "";
        proxy_set_header X-Srw64-Origin "";
        add_header Cache-Control "no-store" always;
        include /etc/nginx/srw64-headers.conf;
    }

    # Fingerprinted build assets and generated images never change under one name.
    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/srw64-headers.conf; }
    location /gen/ { add_header Cache-Control "public, max-age=2592000"; include /etc/nginx/srw64-headers.conf; }
    location /media/ { add_header Cache-Control "public, max-age=604800"; include /etc/nginx/srw64-headers.conf; }
    location = /latest.json { add_header Cache-Control "public, max-age=300"; include /etc/nginx/srw64-headers.conf; }
    # Each doc's Markdown source (/<lang>/docs/<slug>.md, for AI agents): the default
    # mime.types has no .md, which would go out as the default type.
    location ~ \.md$ {
        types { text/markdown md; }
        add_header Cache-Control "public, max-age=600";
        include /etc/nginx/srw64-headers.conf;
        try_files $uri =404;
    }

    # A technical page asked for in Markdown sends the agent to its Markdown source, and the
    # mini stage page to its llms.txt (everything an agent needs to write one). The page's
    # address then answers by Accept, so the CDN, which keys on the address alone, must not
    # keep it; the Markdown and llms.txt addresses are cached as usual.
    location ~ ^/(zh|en|ja)/docs/[a-z0-9-]+/$ {
        add_header Cache-Control "private, no-store" always;
        add_header Vary Accept always;
        include /etc/nginx/srw64-headers.conf;
        if ($srw64_markdown) { return 302 $srw64_agent_doc; }
        # Served here, not through index (which would leave this location and its headers).
        try_files ${uri}index.html =404;
    }

    location / {
        add_header Cache-Control "public, max-age=600";
        include /etc/nginx/srw64-headers.conf;
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
