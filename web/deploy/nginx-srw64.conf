# srw64.dreamquest.club (MARCHWIND 64): static site from /srv/srw64/current/public and
# the site API on 127.0.0.1:3064 under /api/. TLS ends at the Alibaba Cloud CDN, which
# fetches from here over port 80. Installed as /etc/nginx/sites-available/srw64.

map $http_ali_cdn_real_ip $srw64_client {
    "" $remote_addr;
    default $http_ali_cdn_real_ip;
}
limit_req_zone $srw64_client zone=srw64_search:10m rate=5r/s;
limit_req_zone $srw64_client zone=srw64_api:10m rate=20r/s;

server {
    listen 80;
    server_name srw64.dreamquest.club;

    root /srv/srw64/current/public;
    index index.html;
    client_max_body_size 128k;
    # Pages, llms.txt and the docs' Markdown carry Chinese and Japanese: say UTF-8.
    charset utf-8;
    charset_types text/plain text/css text/markdown application/javascript application/json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/story/search {
        limit_req zone=srw64_search burst=15 nodelay;
        proxy_pass http://127.0.0.1:3064;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $srw64_client;
    }

    location /api/ {
        limit_req zone=srw64_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3064;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $srw64_client;
        add_header Cache-Control "no-store" always;
    }

    # Fingerprinted build assets and generated images never change under one name.
    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /gen/ { add_header Cache-Control "public, max-age=2592000"; }
    location /media/ { add_header Cache-Control "public, max-age=604800"; }
    location = /latest.json { add_header Cache-Control "public, max-age=300"; }
    # Each doc's Markdown source (/<lang>/docs/<slug>.md, for AI agents): the default
    # mime.types has no .md, which would go out as the default type.
    location ~ \.md$ {
        types { text/markdown md; }
        add_header Cache-Control "public, max-age=600";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=600";
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
