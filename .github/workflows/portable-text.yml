name: Portable text CPU
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  text:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux text dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfreetype-dev libharfbuzz-dev libicu-dev ninja-build
      - name: Install macOS text dependencies
        if: runner.os == 'macOS'
        run: |
          brew install freetype harfbuzz icu4c ninja
          echo "ICU_ROOT=$(brew --prefix icu4c)" >> "$GITHUB_ENV"
      - name: Install Windows text dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-freetype mingw-w64-ucrt-x86_64-harfbuzz mingw-w64-ucrt-x86_64-icu
      - name: Prepare pinned test fonts (never uploaded as artifacts)
        run: python tests/portable_text/prepare_fonts.py build/text-fonts
      - name: Build and test Unix CPU backend
        if: runner.os != 'Windows'
        run: |
          cmake -S tests/portable_text -B build/portable-text -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSRW64_TEST_CJK_FONT="$PWD/build/text-fonts/NotoSansCJKsc-Regular.otf" \
            -DSRW64_TEST_ARABIC_FONT="$PWD/build/text-fonts/NotoSansArabic-Black.ttf"
          cmake --build build/portable-text --parallel 2
          ctest --test-dir build/portable-text --output-on-failure --verbose
      - name: Build and test Windows UCRT CPU backend
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S tests/portable_text -B build/portable-text -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSRW64_TEST_CJK_FONT="$PWD/build/text-fonts/NotoSansCJKsc-Regular.otf" \
            -DSRW64_TEST_ARABIC_FONT="$PWD/build/text-fonts/NotoSansArabic-Black.ttf"
          cmake --build build/portable-text --parallel 2
          ctest --test-dir build/portable-text --output-on-failure --verbose
      - name: Run Linux memory and undefined-behavior checks
        if: runner.os == 'Linux'
        run: |
          cmake -S tests/portable_text -B build/portable-text-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DSRW64_TEXT_SANITIZERS=ON \
            -DSRW64_TEST_CJK_FONT="$PWD/build/text-fonts/NotoSansCJKsc-Regular.otf" \
            -DSRW64_TEST_ARABIC_FONT="$PWD/build/text-fonts/NotoSansArabic-Black.ttf"
          cmake --build build/portable-text-asan --parallel 2
          ctest --test-dir build/portable-text-asan --output-on-failure --verbose
