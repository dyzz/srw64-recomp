# Windows x64, Linux x64 (Steam Deck) and Android arm64 builds (docs/design/three-platform-port.md,
# docs/design/android-port.md; the macOS app and the HD pack are built on the Mac by
# tools/release/build_release.py).
#
# The game code is recompiled from the ROM, which never enters this public repository:
# the generate job reads it from the private dyzz/srw64-ci-inputs through a read-only
# deploy key (secret CI_INPUTS_DEPLOY_KEY). What it generates is passed to the Windows
# jobs encrypted with CI_ARTIFACT_KEY (artifacts of a public repository can be downloaded
# by anyone) and kept for a day. Only the built program is uploaded in the clear, the
# same as a release download. No log may print ROM bytes or generated sources.
name: build

on:
  workflow_dispatch:
    inputs:
      android_only:
        description: Build only the Android package (testing a branch)
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    # The website and the documents go into no package. Tag pushes ignore these filters.
    paths-ignore: ["web/**", "docs/**", "*.md"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: ROM from the private inputs
        env:
          DEPLOY_KEY: ${{ secrets.CI_INPUTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ci_inputs && chmod 600 ~/.ssh/ci_inputs
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/ci_inputs -o IdentitiesOnly=yes" \
            git clone -q --depth 1 git@github.com:dyzz/srw64-ci-inputs.git "$RUNNER_TEMP/inputs"
          rm -f ~/.ssh/ci_inputs
          (cd "$RUNNER_TEMP/inputs" && sha256sum -c --quiet rom.z64.sha256)
          cp "$RUNNER_TEMP/inputs/rom.z64" rom.z64
          rm -rf "$RUNNER_TEMP/inputs"

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build clang lld
          python3 --version; clang --version | head -1; cmake --version | head -1

      - name: Generate (make up to the CPU code)
        run: |
          make bootstrap recomp-bootstrap recomp-layout recomp-scan recomp-cpu
          export PYTHONPATH=$PWD/src:$PWD/tools
          .venv/bin/python tools/recomp/toolchain/prepare_rt64.py
          .venv/bin/python tools/recomp/toolchain/prepare_frontend.py --fetch
          build/recomp/tool-build/RSPRecomp config/recomp/audio-probe.toml
          .venv/bin/python tools/content/prepare_fonts.py
          du -sh build/recomp/cpu-bound build/recomp/audio-probe build/fonts

      - name: Encrypt the generated inputs
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          # The patched upstream sources go too (without their .git, each revision kept in
          # .srw64-revision), so the Windows job builds exactly what was prepared here.
          find build/recomp/upstream -name .git -prune | while read -r g; do
            d=$(dirname "$g"); git -C "$d" rev-parse HEAD > "$d/.srw64-revision"
          done
          tar -czf "$RUNNER_TEMP/generated.tgz" --exclude=.git \
            build/recomp/cpu-bound build/recomp/audio-probe build/fonts build/recomp/upstream \
            build/recomp/graphics-source-patches.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY \
            -in "$RUNNER_TEMP/generated.tgz" -out generated.tgz.enc
          rm "$RUNNER_TEMP/generated.tgz" rom.z64
          ls -l generated.tgz.enc

      - uses: actions/upload-artifact@v6
        with:
          name: generated-encrypted
          path: generated.tgz.enc
          retention-days: 1
          if-no-files-found: error

  windows:
    needs: generate
    if: ${{ !inputs.android_only }}
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      # Python reads and writes text as UTF-8, not the Windows code page (X3: unspecified encodings).
      PYTHONUTF8: "1"
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      # vcpkg's release 2026.07.29, not the runner's own copy (see the vcpkg step).
      VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: generated-encrypted

      - name: Decrypt the generated inputs
        shell: bash
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          # A relative name: Git's tar reads "D:\..." as a remote host.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in generated.tgz.enc -out generated.tgz
          tar -xzf generated.tgz
          rm generated.tgz.enc generated.tgz

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python environment
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -q -e . -r requirements.lock

      # vcpkg at a fixed release. The runner images in rotation carry different vcpkg copies,
      # whose scripts give the same ICU 78.3 another ABI: half the runs found 6 of their 12
      # packages and rebuilt ICU for 14 minutes. Later steps take this copy through
      # VCPKG_INSTALLATION_ROOT.
      - name: vcpkg
        run: |
          $root = "$env:RUNNER_TEMP\vcpkg"
          git init -q $root
          git -C $root fetch -q --depth 1 https://github.com/microsoft/vcpkg $env:VCPKG_COMMIT
          git -C $root checkout -q FETCH_HEAD
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "VCPKG_INSTALLATION_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VCPKG_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # vcpkg's binary cache; a run that builds any package saves it again.
      - name: vcpkg cache
        uses: actions/cache/restore@v5
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-${{ env.VCPKG_COMMIT }}-${{ github.run_id }}
          restore-keys: vcpkg-x64-windows-${{ env.VCPKG_COMMIT }}-

      - name: FreeType, HarfBuzz, ICU (vcpkg)
        id: vcpkg
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          $before = (Get-ChildItem -Recurse -File vcpkg-cache).Count
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install freetype harfbuzz icu --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((Get-ChildItem -Recurse -File vcpkg-cache).Count -gt $before) { "built=true" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT }

      # Saved right away: ICU takes a quarter of an hour, and later steps may fail.
      - if: steps.vcpkg.outputs.built == 'true'
        uses: actions/cache/save@v5
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-${{ env.VCPKG_COMMIT }}-${{ github.run_id }}

      # The compiler cache (ccache), kept encrypted like the generated inputs: it holds the
      # compiled game code. Each run saves its own copy and starts from the newest one.
      - uses: actions/cache/restore@v5
        with:
          path: ccache.tar.enc
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-windows-

      - name: Decrypt the compiler cache
        shell: bash
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          mkdir -p .ccache
          if [ -f ccache.tar.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in ccache.tar.enc | tar -x -C .ccache
            rm ccache.tar.enc
          fi
          du -sh .ccache

      # ccache from its release, checked against the hash taken when it was pinned.
      - name: ccache
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ccache.zip"
          Invoke-WebRequest -Uri https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-windows-x86_64.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "3D7CEBB05850AD704E197B3F1D3F0F924AB6C9FDFC561578E146184FE9D89380") { throw "ccache checksum mismatch" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\ccache-4.13.6-windows-x86_64" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          }

      - name: Configure
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake -S src/host -B build/recomp/gfx-build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DSRW64_ENABLE_RT64=ON -DSRW64_METAL_SOURCE_SHADERS=OFF `
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON `
            "-DPython3_EXECUTABLE=$PWD/.venv/Scripts/python.exe"

      - name: Game code (output kept out of the log)
        run: |
          cmake --build build/recomp/gfx-build --target srw64_cpu -j 4 *> cpu-build.log
          if ($LASTEXITCODE -ne 0) { "srw64_cpu failed: " + (Select-String -Path cpu-build.log -Pattern "error:" | Measure-Object).Count + " errors"; exit 1 }
          Remove-Item cpu-build.log

      - name: Host
        run: |
          cmake --build build/recomp/gfx-build --target srw64-gfx-host -j 4 -- -k 0
          $built = $LASTEXITCODE
          ccache -s
          if ($built -ne 0) { exit $built }

      - name: Encrypt the compiler cache
        shell: bash
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          tar -c -C .ccache . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -out ccache.tar.enc
          ls -l ccache.tar.enc

      - uses: actions/cache/save@v5
        with:
          path: ccache.tar.enc
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}

      # librashader built from its pinned commit with D3D12 and Vulkan (fetch_librashader.py);
      # the cache keeps the finished library, so Cargo only runs when the pin changes.
      - uses: actions/cache@v5
        with:
          path: build/recomp/thirdparty/librashader/windows
          key: librashader-windows-${{ hashFiles('tools/recomp/toolchain/fetch_librashader.py') }}

      - name: Package
        run: |
          $out = "Marchwind64-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/recomp/gfx-build/srw64-gfx-host.exe "$out/Marchwind64.exe"
          Copy-Item build/recomp/upstream/RT64/src/contrib/mupen64plus-win32-deps/SDL2-2.26.3/lib/x64/SDL2.dll $out
          Get-ChildItem -Recurse build/recomp/gfx-build -Include dxcompiler.dll,dxil.dll | Select-Object -First 2 | Copy-Item -Destination $out
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" $out
          Copy-Item -Recurse build/fonts "$out/fonts"
          Copy-Item -Recurse content/dialogue "$out/dialogue"
          Copy-Item tools/release/windows/Marchwind64.cmd $out
          # librashader (D3D12 and Vulkan, compiled unless cached) and the built-in RetroArch filters
          # (docs/native/bezels-and-filters.md).
          .venv/Scripts/python.exe tools/recomp/toolchain/fetch_librashader.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv/Scripts/python.exe tools/content/fetch_filters.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item build/recomp/thirdparty/librashader/windows/librashader.dll $out
          Copy-Item -Recurse build/filters "$out/filters"
          Remove-Item -Force -ErrorAction SilentlyContinue "$out/filters/.commit"
          New-Item -ItemType Directory -Force "$out/licenses" | Out-Null
          Copy-Item build/recomp/thirdparty/librashader/windows/LICENSE.md "$out/licenses/librashader-LICENSE.md"
          # The VC++ runtime (redistributable with the program), so no separate installer is needed.
          Copy-Item "$env:VCToolsRedistDir/x64/Microsoft.VC143.CRT/*.dll" $out
          dumpbin /nologo /dependents "$out/Marchwind64.exe"
          Get-ChildItem $out | Format-Table Name, Length
          # The packaged program starts: 0.4.0 and 0.4.1 ended before main() went on
          # (0xC0000409 in ucrtbase), on every launch, with nothing in any log.
          $usage = & "$out/Marchwind64.exe" --play --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $usage -notmatch '--play --rom') {
            Write-Error ("Marchwind64.exe --play --help exited 0x{0:X8}" -f $LASTEXITCODE); exit 1
          }

      # The program carries the recompiled game, like a release download; until a release is
      # public it stays encrypted too (decrypt: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000).
      - name: Encrypt the package
        shell: bash
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          tar -czf package.tgz Marchwind64-windows-x64
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -in package.tgz -out Marchwind64-windows-x64.tgz.enc
          rm package.tgz

      - uses: actions/upload-artifact@v6
        with:
          name: Marchwind64-windows-x64-encrypted
          path: Marchwind64-windows-x64.tgz.enc
          retention-days: 7

  linux:
    needs: generate
    if: ${{ !inputs.android_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: generated-encrypted

      - name: Decrypt the generated inputs
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in generated.tgz.enc -out generated.tgz
          tar -xzf generated.tgz
          rm generated.tgz.enc generated.tgz

      # The runtime libraries built from the pinned sources, and those sources.
      - name: Dependency cache
        uses: actions/cache@v5
        with:
          path: |
            build/linux-x64/deps
            build/macos-deps/sources
          key: linux-deps-${{ hashFiles('config/recomp/macos-dependencies.json') }}-v1

      # librashader, compiled with Cargo in the container; the cache keeps the finished library.
      - uses: actions/cache@v5
        with:
          path: build/recomp/thirdparty/librashader/linux
          key: librashader-linux-${{ hashFiles('tools/recomp/toolchain/fetch_librashader.py') }}

      # The compiler cache (ccache), kept encrypted like the generated inputs: it holds the
      # compiled game code. Each run saves its own copy and starts from the newest one.
      - uses: actions/cache/restore@v5
        with:
          path: ccache.tar.enc
          key: ccache-linux-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-linux-

      - name: Decrypt the compiler cache
        shell: bash
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          mkdir -p .ccache
          if [ -f ccache.tar.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in ccache.tar.enc | tar -x -C .ccache
            rm ccache.tar.enc
          fi
          du -sh .ccache

      # The same Ubuntu 22.04 container as tools/release/linux/build.sh (glibc 2.35 baseline).
      - name: Build in the Ubuntu 22.04 container
        run: |
          docker build -q -t srw64-linux-build:jammy tools/release/linux
          docker run --rm -v "$PWD:$PWD" -w "$PWD" -e HOME=/tmp -e PYTHONUTF8=1 \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -e CCACHE_DIR="$PWD/.ccache" -e CCACHE_BASEDIR="$PWD" -e CCACHE_COMPILERCHECK=content -e CCACHE_MAXSIZE=2G \
            -e CMAKE_C_COMPILER_LAUNCHER=ccache -e CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            srw64-linux-build:jammy sh -c 'python3.11 tools/release/build_linux.py --jobs 4 && ccache -s'
          sudo chown -R "$(id -u):$(id -g)" build .ccache
          ls -l build/linux-x64/*.tar.gz

      - name: Encrypt the compiler cache
        shell: bash
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          tar -c -C .ccache . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -out ccache.tar.enc
          ls -l ccache.tar.enc

      - uses: actions/cache/save@v5
        with:
          path: ccache.tar.enc
          key: ccache-linux-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Encrypt the package
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          mv build/linux-x64/*.tar.gz Marchwind64-linux-x64.tar.gz
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -in Marchwind64-linux-x64.tar.gz -out Marchwind64-linux-x64.tar.gz.enc

      - uses: actions/upload-artifact@v6
        with:
          name: Marchwind64-linux-x64-encrypted
          path: Marchwind64-linux-x64.tar.gz.enc
          retention-days: 7

  android:
    needs: generate
    runs-on: ubuntu-24.04
    env:
      SRW64_ANDROID_NDK: "28.2.13676358"
      SRW64_ANDROID_CMAKE: "3.31.6"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: generated-encrypted

      - name: Decrypt the generated inputs
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in generated.tgz.enc -out generated.tgz
          tar -xzf generated.tgz
          rm generated.tgz.enc generated.tgz

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang ccache
          python -m venv .venv
          .venv/bin/python -m pip install -q -e . -r requirements.lock
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$SRW64_ANDROID_NDK" "cmake;$SRW64_ANDROID_CMAKE" "build-tools;36.0.0" "platforms;android-36" > /dev/null
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"

      # FreeType, HarfBuzz and ICU for Android (and the build machine's ICU for its data
      # tools), and the pinned source archives.
      - name: Dependency cache
        uses: actions/cache@v5
        with:
          path: |
            build/android/deps
            build/macos-deps/sources
          key: android-deps-${{ hashFiles('config/recomp/macos-dependencies.json', 'tools/release/android/build_dependencies.py') }}-v1

      # librashader for the RetroArch filters, cross-compiled with Cargo (fetch_librashader.py
      # --android); the cache keeps the finished library.
      - uses: actions/cache@v5
        with:
          path: build/recomp/thirdparty/librashader/android
          key: librashader-android-${{ hashFiles('tools/recomp/toolchain/fetch_librashader.py') }}

      # The compiler cache (ccache), kept encrypted like the generated inputs: it holds the
      # compiled game code. Each run saves its own copy and starts from the newest one.
      - uses: actions/cache/restore@v5
        with:
          path: ccache.tar.enc
          key: ccache-android-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-android-

      - name: Decrypt the compiler cache
        shell: bash
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          mkdir -p .ccache
          if [ -f ccache.tar.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in ccache.tar.enc | tar -x -C .ccache
            rm ccache.tar.enc
          fi
          du -sh .ccache

      - name: Rust target
        run: rustup target add aarch64-linux-android

      - name: FreeType, HarfBuzz, ICU (static, arm64)
        run: .venv/bin/python tools/release/android/build_dependencies.py --jobs 4 > deps-build.log 2>&1 || (tail -40 deps-build.log; exit 1)

      # Signed with the release key when the repository has it, so a CI package installs
      # over a local build (and keeps the saves); otherwise with a key made for this run.
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SRW64_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the package is signed with a throwaway key"
          fi

      - name: Build the APK
        env:
          SRW64_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 2G
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          .venv/bin/python tools/release/android/build_game.py --no-prepare --quiet-game-code
          ccache -s
          apk=build/android/game/srw64-android.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk" > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | head -3
          unzip -l "$apk" | grep -E "lib/arm64-v8a/|classes.dex"
          rev=$(git rev-parse --short HEAD)
          mv "$apk" "SRW64-android-arm64-$rev.apk"

      # The package carries the recompiled game, like the other platforms' downloads; it
      # stays encrypted until a release is public.
      - name: Encrypt the compiler cache
        shell: bash
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          tar -c -C .ccache . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -out ccache.tar.enc
          ls -l ccache.tar.enc

      - uses: actions/cache/save@v5
        with:
          path: ccache.tar.enc
          key: ccache-android-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Encrypt the package
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          apk=$(ls SRW64-android-arm64-*.apk)
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -in "$apk" -out SRW64-android-arm64.apk.enc
          rm "$apk"

      - uses: actions/upload-artifact@v6
        with:
          name: SRW64-android-arm64-encrypted
          path: SRW64-android-arm64.apk.enc
          retention-days: 7
