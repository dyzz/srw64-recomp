# Windows x64, Linux x64 (Steam Deck) and Android arm64 builds (docs/design/three-platform-port.md,
# docs/design/android-port.md; the macOS app and the HD pack are built on the Mac by
# tools/release/build_release.py).
#
# The game code is recompiled from the ROM, which never enters this public repository:
# the generate job reads it from the private dyzz/srw64-ci-inputs through a read-only
# deploy key (secret CI_INPUTS_DEPLOY_KEY). What it generates is passed to the Windows
# jobs encrypted with CI_ARTIFACT_KEY (artifacts of a public repository can be downloaded
# by anyone) and kept for a day. Only the built program is uploaded in the clear, the
# same as a release download. No log may print ROM bytes or generated sources.
name: build

on:
  workflow_dispatch:
    inputs:
      android_only:
        description: Build only the Android package (testing a branch)
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: ROM from the private inputs
        env:
          DEPLOY_KEY: ${{ secrets.CI_INPUTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ci_inputs && chmod 600 ~/.ssh/ci_inputs
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/ci_inputs -o IdentitiesOnly=yes" \
            git clone -q --depth 1 git@github.com:dyzz/srw64-ci-inputs.git "$RUNNER_TEMP/inputs"
          rm -f ~/.ssh/ci_inputs
          (cd "$RUNNER_TEMP/inputs" && sha256sum -c --quiet rom.z64.sha256)
          cp "$RUNNER_TEMP/inputs/rom.z64" rom.z64
          rm -rf "$RUNNER_TEMP/inputs"

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build clang lld
          python3 --version; clang --version | head -1; cmake --version | head -1

      - name: Generate (make up to the CPU code)
        run: |
          make bootstrap recomp-bootstrap recomp-layout recomp-scan recomp-cpu
          export PYTHONPATH=$PWD/src:$PWD/tools
          .venv/bin/python tools/recomp/toolchain/prepare_rt64.py
          .venv/bin/python tools/recomp/toolchain/prepare_frontend.py --fetch
          build/recomp/tool-build/RSPRecomp config/recomp/audio-probe.toml
          .venv/bin/python tools/content/prepare_fonts.py
          du -sh build/recomp/cpu-bound build/recomp/audio-probe build/fonts

      - name: Encrypt the generated inputs
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          # The patched upstream sources go too (without their .git, each revision kept in
          # .srw64-revision), so the Windows job builds exactly what was prepared here.
          find build/recomp/upstream -name .git -prune | while read -r g; do
            d=$(dirname "$g"); git -C "$d" rev-parse HEAD > "$d/.srw64-revision"
          done
          tar -czf "$RUNNER_TEMP/generated.tgz" --exclude=.git \
            build/recomp/cpu-bound build/recomp/audio-probe build/fonts build/recomp/upstream \
            build/recomp/graphics-source-patches.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY \
            -in "$RUNNER_TEMP/generated.tgz" -out generated.tgz.enc
          rm "$RUNNER_TEMP/generated.tgz" rom.z64
          ls -l generated.tgz.enc

      - uses: actions/upload-artifact@v4
        with:
          name: generated-encrypted
          path: generated.tgz.enc
          retention-days: 1
          if-no-files-found: error

  windows:
    needs: generate
    if: ${{ !inputs.android_only }}
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      # Python reads and writes text as UTF-8, not the Windows code page (X3: unspecified encodings).
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: generated-encrypted

      - name: Decrypt the generated inputs
        shell: bash
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          # A relative name: Git's tar reads "D:\..." as a remote host.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in generated.tgz.enc -out generated.tgz
          tar -xzf generated.tgz
          rm generated.tgz.enc generated.tgz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python environment
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -q -e . -r requirements.lock

      - name: vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-freetype-harfbuzz-icu-v1

      - name: FreeType, HarfBuzz, ICU (vcpkg)
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install freetype harfbuzz icu --triplet x64-windows

      # Saved right away: ICU takes a quarter of an hour, and later steps may fail.
      - if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-x64-windows-freetype-harfbuzz-icu-v1

      - name: MSVC environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          }

      - name: Configure
        run: |
          cmake -S src/host -B build/recomp/gfx-build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DSRW64_ENABLE_RT64=ON -DSRW64_METAL_SOURCE_SHADERS=OFF `
            "-DPython3_EXECUTABLE=$PWD/.venv/Scripts/python.exe"

      - name: Game code (output kept out of the log)
        run: |
          cmake --build build/recomp/gfx-build --target srw64_cpu -j 4 *> cpu-build.log
          if ($LASTEXITCODE -ne 0) { "srw64_cpu failed: " + (Select-String -Path cpu-build.log -Pattern "error:" | Measure-Object).Count + " errors"; exit 1 }
          Remove-Item cpu-build.log

      - name: Host
        run: cmake --build build/recomp/gfx-build --target srw64-gfx-host -j 4 -- -k 0

      - name: Package
        run: |
          $out = "SRW64-windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/recomp/gfx-build/srw64-gfx-host.exe "$out/srw64.exe"
          Copy-Item build/recomp/upstream/RT64/src/contrib/mupen64plus-win32-deps/SDL2-2.26.3/lib/x64/SDL2.dll $out
          Get-ChildItem -Recurse build/recomp/gfx-build -Include dxcompiler.dll,dxil.dll | Select-Object -First 2 | Copy-Item -Destination $out
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" $out
          Copy-Item -Recurse build/fonts "$out/fonts"
          Copy-Item -Recurse content/dialogue "$out/dialogue"
          Copy-Item tools/release/windows/srw64.cmd $out
          # The VC++ runtime (redistributable with the program), so no separate installer is needed.
          Copy-Item "$env:VCToolsRedistDir/x64/Microsoft.VC143.CRT/*.dll" $out
          dumpbin /nologo /dependents "$out/srw64.exe"
          Get-ChildItem $out | Format-Table Name, Length

      # The program carries the recompiled game, like a release download; until a release is
      # public it stays encrypted too (decrypt: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000).
      - name: Encrypt the package
        shell: bash
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          tar -czf package.tgz SRW64-windows-x64
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -in package.tgz -out SRW64-windows-x64.tgz.enc
          rm package.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: SRW64-windows-x64-encrypted
          path: SRW64-windows-x64.tgz.enc
          retention-days: 7

  linux:
    needs: generate
    if: ${{ !inputs.android_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: generated-encrypted

      - name: Decrypt the generated inputs
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in generated.tgz.enc -out generated.tgz
          tar -xzf generated.tgz
          rm generated.tgz.enc generated.tgz

      # The runtime libraries built from the pinned sources, and those sources.
      - name: Dependency cache
        uses: actions/cache@v4
        with:
          path: |
            build/linux-x64/deps
            build/macos-deps/sources
          key: linux-deps-${{ hashFiles('config/recomp/macos-dependencies.json') }}-v1

      # The same Ubuntu 22.04 container as tools/release/linux/build.sh (glibc 2.35 baseline).
      - name: Build in the Ubuntu 22.04 container
        run: |
          docker build -q -t srw64-linux-build:jammy tools/release/linux
          docker run --rm -v "$PWD:$PWD" -w "$PWD" -e HOME=/tmp -e PYTHONUTF8=1 \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            srw64-linux-build:jammy python3.11 tools/release/build_linux.py --jobs 4
          sudo chown -R "$(id -u):$(id -g)" build
          ls -l build/linux-x64/*.tar.gz

      - name: Encrypt the package
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          mv build/linux-x64/*.tar.gz SRW64-linux-x64.tar.gz
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -in SRW64-linux-x64.tar.gz -out SRW64-linux-x64.tar.gz.enc

      - uses: actions/upload-artifact@v4
        with:
          name: SRW64-linux-x64-encrypted
          path: SRW64-linux-x64.tar.gz.enc
          retention-days: 7

  android:
    needs: generate
    runs-on: ubuntu-24.04
    env:
      SRW64_ANDROID_NDK: "28.2.13676358"
      SRW64_ANDROID_CMAKE: "3.31.6"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: generated-encrypted

      - name: Decrypt the generated inputs
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in generated.tgz.enc -out generated.tgz
          tar -xzf generated.tgz
          rm generated.tgz.enc generated.tgz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang
          python -m venv .venv
          .venv/bin/python -m pip install -q -e . -r requirements.lock
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$SRW64_ANDROID_NDK" "cmake;$SRW64_ANDROID_CMAKE" "build-tools;36.0.0" "platforms;android-36" > /dev/null
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"

      # FreeType, HarfBuzz and ICU for Android (and the build machine's ICU for its data
      # tools), and the pinned source archives.
      - name: Dependency cache
        uses: actions/cache@v4
        with:
          path: |
            build/android/deps
            build/macos-deps/sources
          key: android-deps-${{ hashFiles('config/recomp/macos-dependencies.json', 'tools/release/android/build_dependencies.py') }}-v1

      - name: FreeType, HarfBuzz, ICU (static, arm64)
        run: .venv/bin/python tools/release/android/build_dependencies.py --jobs 4 > deps-build.log 2>&1 || (tail -40 deps-build.log; exit 1)

      # Signed with the release key when the repository has it, so a CI package installs
      # over a local build (and keeps the saves); otherwise with a key made for this run.
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SRW64_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the package is signed with a throwaway key"
          fi

      - name: Build the APK
        env:
          SRW64_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          .venv/bin/python tools/release/android/build_game.py --no-prepare --quiet-game-code
          apk=build/android/game/srw64-android.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk" > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | head -3
          unzip -l "$apk" | grep -E "lib/arm64-v8a/|classes.dex"
          rev=$(git rev-parse --short HEAD)
          mv "$apk" "SRW64-android-arm64-$rev.apk"

      # The package carries the recompiled game, like the other platforms' downloads; it
      # stays encrypted until a release is public.
      - name: Encrypt the package
        env:
          KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          apk=$(ls SRW64-android-arm64-*.apk)
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -in "$apk" -out SRW64-android-arm64.apk.enc
          rm "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SRW64-android-arm64-encrypted
          path: SRW64-android-arm64.apk.enc
          retention-days: 7
