name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e . -r requirements.lock
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax and dependency checks
        run: |
          python -m compileall -q src tools tests
          python -m pip check
