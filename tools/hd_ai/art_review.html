<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRW64 · 立绘审阅台</title><link rel="stylesheet" href="art_review.css"></head>
<body>
<header><div><span class="eyebrow">SUPER ROBOT WARS 64 / ART REVIEW</span><h1>立绘审阅台 <span>原图 × 当前 HD</span></h1></div><div class="actions"><span id="save-state" role="status">正在读取审阅记录…</span><button id="export">导出记录</button><label class="button">导入记录<input id="import" type="file" accept="application/json" hidden></label></div></header>
<section class="intro"><p>对照原 ROM，检查五官、装甲结构、轮廓与透明边缘。点击图片进入大图，放大后点选同一位置检查细节。</p><p class="muted" id="scope"></p><div class="stats" id="stats"></div></section>
<nav class="toolbar" aria-label="筛选与显示"><div class="tabs" id="kind"><button data-kind="all" aria-pressed="true">全部</button><button data-kind="unit" aria-pressed="false">机体</button><button data-kind="portrait" aria-pressed="false">人物</button></div><input type="search" id="search" placeholder="搜索名称、图号或备注" aria-label="搜索名称、图号或备注"><select id="status" aria-label="审阅状态"><option value="all">全部状态</option><option value="attention">有问题 / 待核对</option><option value="unreviewed">未审阅</option><option value="overview">已概览，待细查</option><option value="suspect">疑似问题</option><option value="issue">确认问题</option><option value="pass">细查通过</option><option value="technical">技术提示</option><option value="candidate">有修正候选</option></select><select id="sort" aria-label="排序"><option value="priority">问题优先</option><option value="id">资源顺序</option><option value="delta">色彩变化优先</option><option value="iou">轮廓偏差优先</option></select><select id="background" aria-label="图片底色"><option value="gray">中性灰</option><option value="blue">对白蓝</option><option value="checker">棋盘格</option><option value="black">黑色</option><option value="white">白色</option></select></nav>
<main><div class="list-heading"><span id="count"></span><span>左：ROM 原图 · 右：游戏当前 HD</span></div><div id="grid" class="grid"></div><div class="pagination"><button id="previous-page">上一页</button><span id="page-label"></span><button id="next-page">下一页</button></div></main>
<dialog id="viewer"><div class="viewer-head"><div><span class="eyebrow" id="v-id"></span><h2 id="v-name"></h2></div><button id="close">关闭 Esc</button></div><div class="viewer-toolbar"><button id="prev">← 上一张</button><button id="next">下一张 →</button><select id="view-mode" aria-label="大图对比方式"><option value="side">并排对照</option><option value="wipe">滑动对照</option><option value="blink">单图切换</option></select><label>放大 <input id="zoom" type="range" min="1" max="5" step="0.25" value="1"><span id="zoom-label">1×</span></label><button id="reset-zoom">复位</button><label id="candidate-label" hidden><input id="candidate-toggle" type="checkbox">右图看修正候选（未接入）</label></div><div class="viewer-body"><div><div id="comparison"></div><div class="wipe-control" id="wipe-control" hidden><label>拖动分界 <input id="wipe" type="range" min="0" max="100" value="50"></label></div><p class="muted">点击画面定位放大中心；空格切换 ROM / HD，← → 翻页。放大用于核对细节，原图按最近邻显示。</p></div><aside><label for="decision">审阅状态</label><select id="decision"><option value="unreviewed">未审阅</option><option value="overview">已概览，待细查</option><option value="suspect">疑似问题</option><option value="issue">确认问题</option><option value="pass">细查通过</option></select><label for="note">问题 / 审阅备注</label><textarea id="note" rows="7" placeholder="记录位置、原图依据、问题表现及修正建议"></textarea><button class="primary" id="save-review">保存本张记录</button><p id="review-feedback" role="status"></p><div id="v-metrics"></div><p class="muted">自动指标用于安排检查顺序，不能判断五官是否画对。“细查通过”需对照大图确认。</p></aside></div></dialog>
<script>window.ART_DATA = /*REVIEW_DATA*/null;</script><script src="art_review.js"></script>
</body></html>
