[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "srw64-w0"
version = "0.2.0"
description = "Reproducible Super Robot Wars 64 localization and runtime validation tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow==12.3.0"]

[project.scripts]
srw64-w0 = "srw64_w0.cli:main"
srw64-w1 = "srw64_w0.w1_cli:main"
srw64-text-inventory = "srw64_w0.inventory_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
