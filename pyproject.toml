[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "srw64-recomp"
version = "0.2.0"
description = "Super Robot Wars 64 native recompilation, content and runtime validation tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow==12.3.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
